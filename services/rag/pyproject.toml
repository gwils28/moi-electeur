[project]
name = "moi-electeur-rag"
version = "0.0.0"
description = "Service de retrieval (embedding local, hybride pgvector + FTS, RRF)."
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.163",
    "numpy>=2.5.5",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "sentence-transformers>=6.3.0",
    "torch>=2.15.0",
    "uvicorn>=0.54",
]

[dependency-groups]
dev = ["httpx>=0.28", "mypy>=2.4", "pytest>=9.2", "ruff>=0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "db: nécessite PostgreSQL + pgvector (DATABASE_URL ; ignoré en local sans base, obligatoire en CI)",
  "model: télécharge un vrai modèle d'embedding (lancé à la main : -m model)",
]
addopts = "-m 'not model'"
