name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @moi-electeur/web build

  e2e:
    runs-on: ubuntu-latest
    needs: js
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @moi-electeur/web exec playwright install --with-deps chromium
      - run: pnpm --filter @moi-electeur/web e2e

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages --frozen
      - run: uv run --project pipeline ruff check .
      - run: uv run --project pipeline ruff format --check .
      - run: uv run --project pipeline mypy pipeline/src services/rag/src eval/src
      - run: uv run --project pipeline pytest -q pipeline
      - run: uv run --project services/rag pytest -q services/rag
      - run: uv run --project eval pytest -q eval

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages --frozen
      - run: uv run pipeline validate
      - run: uv run pipeline make-demo --check
      - run: uv run pipeline gen-models --check

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages --frozen
      - run: uv run --project notebooks pytest -q notebooks

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check-no-em-dash.py
      - run: python3 scripts/check-forbidden-words.py
      - uses: astral-sh/setup-uv@v6
      - run: uv run --project pipeline pytest -q scripts/tests
