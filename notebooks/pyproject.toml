[project]
name = "moi-electeur-notebooks"
version = "0.0.0"
description = "Notebooks R&D marimo (PLAN § 1 bis)."
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = ["marimo>=0.25", "matplotlib>=3.11", "moi-electeur-pipeline", "numpy>=2.5", "pandas>=3.1"]

[tool.uv]
package = false

[tool.uv.sources]
moi-electeur-pipeline = { workspace = true }

[dependency-groups]
dev = ["pytest>=9.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
