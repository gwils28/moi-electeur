[project]
name = "moi-electeur-eval"
version = "0.0.0"
description = "Backtests et évaluations (RAG, positionnement, neutralité, profils synthétiques)."
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = ["moi-electeur-pipeline", "moi-electeur-rag", "numpy>=2.5"]

[project.scripts]
moi-electeur-eval = "moi_electeur_eval.cli:main"

[dependency-groups]
dev = ["mypy>=2.4", "pytest>=9.2", "ruff>=0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
moi-electeur-pipeline = { workspace = true }
moi-electeur-rag = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "db: nécessite PostgreSQL + pgvector (DATABASE_URL ; ignoré en local sans base, obligatoire en CI)",
]
