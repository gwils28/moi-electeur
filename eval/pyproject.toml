[project]
name = "moi-electeur-eval"
version = "0.0.0"
description = "Backtests et évaluations (RAG, positionnement, neutralité, profils synthétiques)."
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["mypy>=2.4", "pytest>=9.2", "ruff>=0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
