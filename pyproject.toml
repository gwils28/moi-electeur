# Workspace uv (racine virtuelle) : pipeline, services/rag, eval, notebooks.
[tool.uv.workspace]
members = ["pipeline", "services/rag", "eval", "notebooks"]

# Torch en version CPU uniquement (PLAN § 4.3) : pas de dépendances CUDA dans l'image ni en CI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/generated/**", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "E501",  # longueur gérée par ruff format (les chaînes longues restent permises)
  "RUF001", "RUF002", "RUF003",  # caractères français (apostrophes, guillemets)
]

[tool.ruff.lint.isort]
known-first-party = ["moi_electeur_pipeline", "moi_electeur_rag", "moi_electeur_eval"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["B018", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["generated/", "notebooks/"]
# PyMuPDF expose des signatures incomplètes : ses appels non typés sont tolérés.
untyped_calls_exclude = ["pymupdf"]
